<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
  <rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Internet</text>
  <text font-family="sans-serif" font-size="12" x="340" y="57" text-anchor="middle" fill="#5F5E5A">your curl request</text>
  <line x1="340" y1="64" x2="340" y2="102" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="358" y="87" fill="#888780">HTTP :80</text>
  <rect x="30" y="106" width="620" height="440" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="54" y="128" dominant-baseline="central" fill="#0C447C">AWS VPC — eu-west-1</text>
  <rect x="54" y="150" width="572" height="130" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="78" y="172" dominant-baseline="central" fill="#085041">Public subnet — 10.0.1.0/24</text>
  <rect x="190" y="188" width="300" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="210" text-anchor="middle" dominant-baseline="central" fill="#712B13">gateway-vm</text>
  <text font-family="sans-serif" font-size="12" x="340" y="230" text-anchor="middle" fill="#993C1D">63.34.9.220 · nginx · t3.micro</text>
  <text font-family="sans-serif" font-size="12" x="340" y="248" text-anchor="middle" fill="#993C1D">proxies :80 → caller :3111</text>
  <line x1="340" y1="280" x2="340" y2="318" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="358" y="303" fill="#888780">proxy_pass</text>
  <rect x="54" y="322" width="572" height="200" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="78" y="344" dominant-baseline="central" fill="#3C3489">Private subnet — 10.0.2.0/24</text>
  <rect x="78" y="366" width="254" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="205" y="392" text-anchor="middle" fill="#3C3489">caller-vm</text>
  <text font-family="sans-serif" font-size="12" x="205" y="412" text-anchor="middle" fill="#534AB7">10.0.2.194 · t3.micro</text>
  <text font-family="sans-serif" font-size="12" x="205" y="430" text-anchor="middle" fill="#534AB7">iii engine :49134</text>
  <text font-family="sans-serif" font-size="12" x="205" y="448" text-anchor="middle" fill="#534AB7">TypeScript worker :3111</text>
  <text font-family="sans-serif" font-size="12" x="205" y="466" text-anchor="middle" fill="#534AB7">inference::get_response</text>
  <line x1="332" y1="432" x2="348" y2="432" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text font-family="sans-serif" font-size="12" x="340" y="418" text-anchor="middle" fill="#888780">RPC ws://49134</text>
  <rect x="348" y="366" width="254" height="130" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="475" y="392" text-anchor="middle" fill="#633806">inference-vm</text>
  <text font-family="sans-serif" font-size="12" x="475" y="412" text-anchor="middle" fill="#854F0B">10.0.2.241 · t3.small</text>
  <text font-family="sans-serif" font-size="12" x="475" y="430" text-anchor="middle" fill="#854F0B">Python worker</text>
  <text font-family="sans-serif" font-size="12" x="475" y="448" text-anchor="middle" fill="#854F0B">gemma-3-270m GGUF</text>
  <text font-family="sans-serif" font-size="12" x="475" y="466" text-anchor="middle" fill="#854F0B">inference::run_inference</text>
  <text font-family="sans-serif" font-size="12" x="340" y="545" text-anchor="middle" fill="#888780">workers unreachable from internet · all RPC stays inside subnet</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
